# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.21.1
loader_version=0.19.2
min_loader_version=0.15.11
loom_version=1.16-SNAPSHOT

# Dependencies
fabric_api_version=0.116.12+1.21.1

## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=enchantonce
# The human-readable display name for the mod.
mod_name=EnchantOnce
# The license of the mod. Review your options at https://choosealicense.com/. All Rights Reserved is the default.
mod_license=Custom License, see: https://github.com/spekarchik/EnchantOnce/blob/main/license.md
# The mod version. See https://semver.org/
mod_version=1.21.1-fabric-2.5.2-beta
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
# See https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=com.pekar.enchantonce
# A URL for the "homepage" for this mod, displayed in the mod UI
home_page=https://www.curseforge.com/minecraft/mc-mods/enchantonce
# The authors of the mod. This is a simple text string that is used for display purposes in the mod list.
mod_authors=Sergey Pekarchik
# The description of the mod. This is a simple multiline text string that is used for display purposes in the mod list.
mod_description=A configurable mod that reworks anvil enchanting and repairing:\
  \n - fixed XP costs\
  \n - enchant extraction\
  \n - book copying\
  \n - full gear duplication\
  \n - no enchantment level increases from anvil combining\
  \n - downgrade enchantment books\
  \n - all using vanilla mechanics.
